name: PracticeLab Frappe smoke

on:
  push:
    branches: [draft/practicelab-frappe, draft/practicelab-onboarding, draft/practicelab-start-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRACTICELAB_URL: http://127.0.0.1:8000
      PRACTICELAB_SMOKE_USER: scheduler@example.invalid
      PRACTICELAB_SMOKE_CHECK_DESK: "1"
      PRACTICELAB_OPENHR_TEST_SITE_NAME: openhr.localhost
    steps:
      - uses: actions/checkout@v4
      - name: Build PracticeLab test image
        run: docker build --build-arg INCLUDE_OPENHR=1 -f deploy/practicelab/Dockerfile -t practicelab:smoke .
      - name: Start a disposable Frappe site
        shell: bash
        run: |
          set -euo pipefail
          export PRACTICELAB_DB_ROOT_PASSWORD="$(openssl rand -hex 20)"
          export PRACTICELAB_SMOKE_PASSWORD="Aa1!$(openssl rand -hex 20)"
          echo "::add-mask::$PRACTICELAB_DB_ROOT_PASSWORD"
          echo "::add-mask::$PRACTICELAB_SMOKE_PASSWORD"
          echo "PRACTICELAB_SMOKE_PASSWORD=$PRACTICELAB_SMOKE_PASSWORD" >> "$GITHUB_ENV"
          docker network create practicelab
          docker run -d --name redis --network practicelab redis:6.2-alpine
          docker run -d --name db --network practicelab \
            -e MARIADB_ROOT_PASSWORD="$PRACTICELAB_DB_ROOT_PASSWORD" \
            mariadb:10.6 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          docker run -d --name practice --network practicelab -p 127.0.0.1:8000:8000 -p 127.0.0.1:8010:8010 \
            -e PRACTICELAB_SMOKE_USER -e PRACTICELAB_SMOKE_PASSWORD -e PRACTICELAB_DB_ROOT_PASSWORD \
            practicelab:smoke sleep infinity
          docker exec practice bash -euc '
            for attempt in {1..40}; do
              if mariadb --host=db -uroot -p"$PRACTICELAB_DB_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            bench set-config -g db_host db
            bench set-config -g redis_cache redis://redis:6379/0
            bench set-config -g redis_queue redis://redis:6379/1
            bench set-config -g redis_socketio redis://redis:6379/2
            printf "%s\n" frappe open_practice > sites/apps.txt
            mkdir -p sites/assets
            ln -s /home/frappe/frappe-bench/apps/open_practice/src/open_practice/public sites/assets/open_practice
            bench new-site practicelab.localhost --mariadb-user-host-login-scope="%" \
              --db-root-password "$PRACTICELAB_DB_ROOT_PASSWORD" --admin-password "$PRACTICELAB_SMOKE_PASSWORD"
            bench --site practicelab.localhost set-config -p open_practice_practicelab 1
            bench --site practicelab.localhost set-config -p open_practice_novitas_test 1
            bench --site practicelab.localhost install-app open_practice
            bench --site practicelab.localhost execute frappe.desk.page.setup_wizard.setup_wizard.setup_complete \
              --args "[{\"language\":\"English\",\"country\":\"United States\",\"timezone\":\"America/Denver\",\"currency\":\"USD\"}]"
            bench --site practicelab.localhost execute open_practice.practicelab_smoke.create_user
            bench use practicelab.localhost
          '
          docker exec -d practice bash -c \
            'bench --site practicelab.localhost serve --port 8000 --noreload >/tmp/frappe-http.log 2>&1'
          if ! curl -fsS --retry 15 --retry-all-errors --retry-delay 2 "$PRACTICELAB_URL/api/method/ping"; then
            docker exec practice tail -60 /tmp/frappe-http.log
            exit 1
          fi
      - name: Sign in, book, and complete a session
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python deploy/practicelab/smoke.py
      - name: Verify signup by mail and land on New Practice
        if: github.ref_name == 'draft/practicelab-start-now'
        run: |
          docker run -d --name mailpit --network practicelab -p 127.0.0.1:8025:8025 axllent/mailpit:v1.27.8
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8025/api/v1/messages >/dev/null
          python deploy/practicelab/signup_smoke.py
      - name: Start the disposable openHR fork site
        shell: bash
        run: |
          set -euo pipefail
          export PRACTICELAB_COMPANY_KEY="$(openssl rand -hex 8)"
          export PRACTICELAB_COMPANY_SECRET="$(openssl rand -hex 16)"
          echo "::add-mask::$PRACTICELAB_COMPANY_KEY"
          echo "::add-mask::$PRACTICELAB_COMPANY_SECRET"
          echo "PRACTICELAB_COMPANY_KEY=$PRACTICELAB_COMPANY_KEY" >> "$GITHUB_ENV"
          echo "PRACTICELAB_COMPANY_SECRET=$PRACTICELAB_COMPANY_SECRET" >> "$GITHUB_ENV"
          docker exec -e PRACTICELAB_COMPANY_KEY -e PRACTICELAB_COMPANY_SECRET -e PRACTICELAB_OPENHR_TEST_SITE_NAME practice bash -euc '
            printf "%s\n" erpnext hrms >> sites/apps.txt
            bench new-site openhr.localhost --mariadb-user-host-login-scope="%" \
              --db-root-password "$PRACTICELAB_DB_ROOT_PASSWORD" --admin-password "$PRACTICELAB_SMOKE_PASSWORD"
            bench --site openhr.localhost install-app erpnext
            bench --site openhr.localhost install-app hrms
            env/bin/python -m open_practice.practicelab_onboarding_smoke configure-openhr openhr.localhost
            bench --site practicelab.localhost execute open_practice.practicelab_onboarding_smoke.configure_practicelab
          '
          docker exec -d practice bash -c \
            'env/bin/gunicorn --chdir sites --bind 0.0.0.0:8010 --workers 2 frappe.app:application >/tmp/openhr-http.log 2>&1'
          docker cp deploy/practicelab/openhr_fault_proxy.py practice:/tmp/openhr_fault_proxy.py
          docker exec -d practice bash -c \
            'env/bin/python /tmp/openhr_fault_proxy.py >/tmp/openhr-proxy.log 2>&1'
          if ! curl -fsS --retry 15 --retry-all-errors --retry-delay 2 -H "X-Frappe-Site-Name: $PRACTICELAB_OPENHR_TEST_SITE_NAME" "http://127.0.0.1:8010/api/method/ping"; then
            docker exec practice tail -60 /tmp/openhr-http.log
            exit 1
          fi
          docker exec -e PRACTICELAB_COMPANY_KEY -e PRACTICELAB_COMPANY_SECRET -e PRACTICELAB_OPENHR_TEST_SITE_NAME practice bash -euc '
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \
              -H "Authorization: token $PRACTICELAB_COMPANY_KEY:$PRACTICELAB_COMPANY_SECRET" \
              -H "X-Frappe-Site-Name: $PRACTICELAB_OPENHR_TEST_SITE_NAME" \
              "http://127.0.0.1:8011/api/resource/Company" >/dev/null
          '
      - name: Verify practice create, link, and lost response in the browser
        run: python deploy/practicelab/onboarding_smoke.py

      - name: Collect disposable site diagnostics
        if: failure()
        run: |
          docker exec practice sh -c 'for log in /tmp/frappe-http.log /tmp/openhr-http.log /tmp/openhr-proxy.log; do
            if test -f "$log"; then tail -45 "$log"; fi
          done'
